# Publishes the cloud part (workout reminders and the database rules) whenever it changes on main.
# Needs one repository secret, FIREBASE_SERVICE_ACCOUNT: a service account key (JSON) of the gym1-88389 project.
name: Cloud

on:
  push:
    branches: [main]
    paths: ['functions/**', 'firestore.rules', 'firebase.json', '.github/workflows/cloud.yml']
  pull_request:
    paths: ['functions/**', 'firestore.rules', 'firebase.json', '.github/workflows/cloud.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
        working-directory: functions
      - run: npm test
        working-directory: functions

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
        working-directory: functions
      - name: Deploy reminders and database rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing repository secret FIREBASE_SERVICE_ACCOUNT (see README, workout reminders)."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@14 deploy --only functions,firestore:rules --project gym1-88389 --non-interactive --force
          rm -f "$RUNNER_TEMP/sa.json"
